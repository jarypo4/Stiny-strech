(()=>{'use strict';
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W=0,H=0,dpr=1,scale=1,viewW=960,viewH=540,cam=0,last=0,level=0,paused=true,player,enemies=[],particles=[],arrows=[],plats=[],ladders=[],anchors=[],props=[],goal,worldW=2600,tipTime=0,tipText='',messageTime=0,horseActive=false,gameWon=false;
const stories=[
{title:'I. Posel soumraku',place:'Staré tržiště',text:'Rok 1328. Město Vranov ovládá tajný řád Havraní pečeti. Mladý posel Radovan objevil listinu dokazující zradu městské rady. Jeho sestra Eliška zmizela. První stopa vede přes tržiště ke staré bráně.',quote:'Radovan: „Jestli mě chtějí umlčet, musí mě nejdřív chytit.“',type:'town',length:2900,guards:5},
{title:'II. Střechy nad řekou',place:'Říční čtvrť',text:'Písař z tržiště zanechal znamení na zvonici. Cesta přes řeku je střežena, ale staré lanové kotvy na střechách stále drží. Za vodou čeká kurýr s další částí listiny.',quote:'Neznámý hlas: „Po zemi tě najdou. Hledej cestu nad nimi.“',type:'river',length:3300,guards:7},
{title:'III. Královská stezka',place:'Les a pastviny',text:'Kurýr prozradil, že Elišku odvezli do severní pevnosti. Radovan se zmocnil koně a vyráží přes hlídanou obchodní stezku. Hlídkám se ale nevyhne.',quote:'Radovan: „Na koni budu rychlejší. Jen nesmím ztratit stopu.“',type:'forest',length:3400,guards:8},
{title:'IV. Zdi bez milosti',place:'Hradní předměstí',text:'Vnější hradby pevnosti obklopují dílny, strážnice a vysoké věže. Velitel hlídky má klíč od vnitřní brány. Radovan musí přežít a dostat se až k pevnosti.',quote:'Strážný: „Nikdo odsud neprojde živý!“',type:'fort',length:3500,guards:9},
{title:'V. Podzemní tajemství',place:'Katakomby',text:'Pod pevností se skrývá stará síť chodeb. V kamenných celách Radovan nalézá stopy Elišky a důkaz, že Havraní pečeť připravuje převrat. Za poslední mříží je východ na nádvoří.',quote:'Eliščin vzkaz: „Bratře, nevěř veliteli. Pán řádu nosí stříbrnou masku.“',type:'crypt',length:3200,guards:9},
{title:'VI. Stříbrná maska',place:'Citadela',text:'Na nádvoří čeká mistr řádu Bohuslav, muž ve stříbrné masce. Eliška je naživu, ale cesta k ní vede přes poslední stráže a samotného velitele. Dnes se rozhodne o osudu Vranova.',quote:'Bohuslav: „Jedna listina nezmění dějiny.“ Radovan: „Ale pravda ano.“',type:'citadel',length:3600,guards:10}];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);viewH=540;viewW=viewH*W/H;scale=H/viewH;x.setTransform(dpr*scale,0,0,dpr*scale,0,0)}addEventListener('resize',resize);resize();
let stickX=0,stickY=0,stickId=null,attackHeld=false;const stick=$('stick'),knob=$('knob');function setStick(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),m=r.width*.36,l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}stickX=dx/m;stickY=dy/m;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{e.preventDefault();stickId=e.pointerId;stick.setPointerCapture(e.pointerId);setStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e)});function stopStick(e){if(e.pointerId!==stickId)return;stickId=null;stickX=stickY=0;knob.style.transform=''}stick.addEventListener('pointerup',stopStick);stick.addEventListener('pointercancel',stopStick);
let keys={};addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(e.repeat)return;if(e.code==='KeyJ')attack();if(e.code==='KeyK')changeWeapon();if(e.code==='KeyL')useRope();if(e.code==='KeyE')toggleHorse()});addEventListener('keyup',e=>keys[e.code]=false);$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attackHeld=true;attack()});for(const ev of ['pointerup','pointercancel','pointerleave'])$('attack').addEventListener(ev,()=>attackHeld=false);$('weapon').onclick=changeWeapon;$('rope').onclick=useRope;$('horse').onclick=toggleHorse;
function say(t,sec=3){$('subtitle').textContent=t;$('subtitle').style.display='block';messageTime=sec}function hint(t,sec=3){tipText=t;tipTime=sec}
function modal(title,html,button,cb){paused=true;$('modal').style.display='flex';$('panel').innerHTML=`<h1>${title}</h1>${html}<button class="primary" id="next">${button}</button>`;$('next').onclick=()=>{$('modal').style.display='none';paused=false;cb?.()}}
function makeLevel(n){level=n;let s=stories[n];worldW=s.length;plats=[];ladders=[];anchors=[];props=[];enemies=[];particles=[];arrows=[];cam=0;horseActive=false;gameWon=false;
// continuous playable ground with roof platforms and gaps above
plats.push({x:0,y:468,w:worldW,h:100,kind:'ground'});
for(let i=0;i<Math.ceil(worldW/310);i++){let bx=160+i*310+(i%3)*12,by=315+(i%3)*24;plats.push({x:bx,y:by,w:195,h:20,kind:'roof'});if(i%2===0)ladders.push({x:bx+28,y:by,w:27,h:468-by});if(i%2===1)anchors.push({x:bx+105,y:by-90});props.push({x:bx+40,kind:i%3===0?'banner':i%3===1?'crate':'lamp'});}
for(let i=0;i<s.guards;i++){let ex=440+i*((worldW-650)/Math.max(1,s.guards-1));enemies.push({x:ex,y:426,vx:0,vy:0,w:27,h:42,hp:n===5&&i===s.guards-1?14:n>2?4:3,maxhp:n===5&&i===s.guards-1?14:n>2?4:3,boss:n===5&&i===s.guards-1,dir:-1,patrol:ex,atk:0,hit:0,alive:true,ground:true})}
player={x:60,y:410,vx:0,vy:0,w:26,h:56,hp:100,maxhp:100,dir:1,ground:false,climb:false,weapon:0,atk:0,cool:0,inv:0,rope:null,arrows:30};goal={x:worldW-110,y:390};$('mission').textContent=s.title;$('status').textContent=`Meč · 0/${enemies.length} stráží`;
modal(s.title,`<p><strong>${s.place}</strong></p><p>${s.text}</p><p><em>${s.quote}</em></p><p style="font-size:12px;color:#c4d5de">Joystick: do stran pohyb, nahoru skok / lezení. ⚔ změna zbraně · 🪝 lano · 🐎 kůň · ÚTOK. Na počítači WASD/šipky, J, K, L, E.</p>`,'Začít misi',()=>{say(s.quote,4);hint('Dostaň se k zářící bráně na konci úrovně.',5)})}
function changeWeapon(){if(paused)return;player.weapon=(player.weapon+1)%3;hint(['Meč: silné zásahy zblízka','Dýka: rychlé krátké útoky','Luk: šípy na dálku'][player.weapon],2)}
function useRope(){if(paused)return;if(player.rope){player.rope=null;hint('Lano uvolněno',1);return}let near=anchors.filter(a=>Math.hypot(a.x-(player.x+13),a.y-player.y)<235).sort((a,b)=>Math.hypot(a.x-player.x,a.y-player.y)-Math.hypot(b.x-player.x,b.y-player.y))[0];if(near){player.rope={a:near,len:Math.max(85,Math.hypot(near.x-player.x,near.y-player.y))};hint('Lano připojeno · pohybem se rozhoupej',2)}else hint('Přibliž se k zavěšenému kruhu',2)}
function toggleHorse(){if(paused)return;if(!['forest','fort'].includes(stories[level].type)){hint('Kůň je dostupný v lesní a hradní misi',2);return}horseActive=!horseActive;player.rope=null;hint(horseActive?'Nasedl jsi na koně · rychlejší pohyb':'Sesedl jsi z koně',2)}
function attack(){if(paused||player.cool>0)return;let w=player.weapon;player.atk=w===1?.18:.28;player.cool=w===1?.25:w===2?.58:.42;if(w===2){if(player.arrows<=0){hint('Došly šípy! Přepni zbraň.',2);return}player.arrows--;arrows.push({x:player.x+13+player.dir*20,y:player.y+23,vx:player.dir*690,life:1.4});return}let reach=w===0?88:57;for(let e of enemies){if(!e.alive)continue;let dx=e.x-player.x;if(Math.abs(dx)<reach&&Math.abs(e.y-player.y)<70&&Math.sign(dx)===player.dir){damageEnemy(e,w===0?2:1);e.x+=player.dir*12}}}
function damageEnemy(e,d){if(!e.alive)return;e.hp-=d;e.hit=.2;for(let i=0;i<7;i++)particles.push({x:e.x+12,y:e.y+15,vx:rnd(-100,100),vy:rnd(-110,20),life:rnd(.2,.5),color:'#edbc73'});if(e.hp<=0){e.alive=false;hint(e.boss?'Velitel padl! Cesta je volná.':'Stráž poražena',1.7)}}
function hitPlayer(d){if(player.inv>0)return;player.hp=clamp(player.hp-d,0,100);player.inv=.75;player.vx-=player.dir*95;say('Radovan: „Tohle bolelo!“',1.1);if(player.hp<=0)modal('Radovan padl',`<p>Havraní pečeť zatím vítězí. Zkus misi znovu.</p>`,'Opakovat misi',()=>makeLevel(level))}
function physics(o,dt){let oldY=o.y;o.vy+=1350*dt;o.y+=o.vy*dt;o.ground=false;for(let p of plats){if(o.x+o.w>p.x&&o.x<p.x+p.w&&oldY+o.h<=p.y+8&&o.y+o.h>=p.y&&o.vy>=0){o.y=p.y-o.h;o.vy=0;o.ground=true}}if(o.y>750){o.y=250;o.vy=0;if(o===player)hitPlayer(18)}}
function update(dt){if(paused)return;dt=Math.min(dt,.035);let h=stickX+(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0),up=stickY<-.55||keys.ArrowUp||keys.KeyW||keys.Space,down=stickY>.55||keys.ArrowDown||keys.KeyS;if(Math.abs(h)<.2)h=0;h=clamp(h,-1,1);if(h)player.dir=Math.sign(h);player.vx=h*(horseActive?340:205);player.x=clamp(player.x+player.vx*dt,0,worldW-player.w);player.cool=Math.max(0,player.cool-dt);player.atk=Math.max(0,player.atk-dt);player.inv=Math.max(0,player.inv-dt);
let ladder=ladders.find(l=>player.x+player.w>l.x&&player.x<l.x+l.w&&player.y+player.h>l.y&&player.y<l.y+l.h);if(ladder&&up&&!horseActive){player.climb=true;player.vy=0;player.y-=175*dt;player.y=Math.max(ladder.y-player.h,player.y)}else if(ladder&&down&&player.climb){player.vy=0;player.y+=160*dt}else{if(up&&player.ground){player.vy=horseActive?-455:-510;player.ground=false}player.climb=false;physics(player,dt)}
if(player.rope){let a=player.rope.a,dx=player.x+13-a.x,dy=player.y+12-a.y,len=Math.hypot(dx,dy);if(len>player.rope.len){let nx=dx/len,ny=dy/len;player.x=a.x+nx*player.rope.len-13;player.y=a.y+ny*player.rope.len-12;player.vy=Math.min(player.vy,0)}if(up){player.rope.len=Math.max(65,player.rope.len-115*dt)}if(down)player.rope.len=Math.min(240,player.rope.len+115*dt)}
if(attackHeld&&player.cool<=0)attack();for(let e of enemies){if(!e.alive)continue;e.hit=Math.max(0,e.hit-dt);e.atk=Math.max(0,e.atk-dt);let dx=player.x-e.x,close=Math.abs(dx)<260&&Math.abs(player.y-e.y)<100;if(close){e.dir=Math.sign(dx)||e.dir;e.vx=Math.sign(dx)*((e.boss?95:75)+level*4)}else{e.dir=(e.x>e.patrol+80?-1:e.x<e.patrol-80?1:e.dir);e.vx=e.dir*28}e.x=clamp(e.x+e.vx*dt,0,worldW-e.w);physics(e,dt);if(Math.abs(dx)<42&&Math.abs(player.y-e.y)<55&&e.atk<=0){e.atk=e.boss?.65:1.05;hitPlayer(e.boss?19:9)}}
for(let a of arrows){a.x+=a.vx*dt;a.life-=dt;for(let e of enemies)if(e.alive&&a.life>0&&a.x>e.x&&a.x<e.x+e.w&&a.y>e.y&&a.y<e.y+e.h){damageEnemy(e,2);a.life=0}}arrows=arrows.filter(a=>a.life>0);for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=330*dt;p.life-=dt}particles=particles.filter(p=>p.life>0);
let defeated=enemies.filter(e=>!e.alive).length;$('status').textContent=`${['Meč','Dýka','Luk'][player.weapon]}${player.weapon===2?' ('+player.arrows+' šípů)':''} · ${defeated}/${enemies.length} stráží`;$('hpfill').style.width=player.hp+'%';if(messageTime>0){messageTime-=dt;if(messageTime<=0)$('subtitle').style.display='none'}if(tipTime>0){tipTime-=dt;$('tip').textContent=tipText}else $('tip').textContent='';if(player.x>goal.x-25){if(enemies.some(e=>e.alive&&e.boss)){hint('Nejdřív poraz velitele se stříbrnou maskou!',2);player.x=goal.x-45}else if(level===stories.length-1){gameWon=true;modal('Vranov je svobodný',`<p>Radovan porazil Bohuslava a osvobodil Elišku. Listina se dostala mezi lid a Havraní pečeť přišla o moc.</p><p><em>Eliška: „Myslela jsem, že už tě neuvidím.“</em></p><p><strong>Konec první kapitoly příběhu.</strong> Děkujeme za hraní!</p>`,'Hrát znovu',()=>makeLevel(0))}else{let n=level+1;modal('Mise dokončena!',`<p>${stories[level].place} je za tebou. Porazil jsi ${defeated} z ${enemies.length} stráží.</p><p>Další kapitola: <strong>${stories[n].title}</strong></p>`,'Pokračovat',()=>makeLevel(n))}}cam+=(clamp(player.x-viewW*.35,0,Math.max(0,worldW-viewW))-cam)*Math.min(1,dt*5)}
function poly(pts,color){x.fillStyle=color;x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)x.lineTo(pts[i][0],pts[i][1]);x.closePath();x.fill()}function rect(a,b,w,h,col){x.fillStyle=col;x.fillRect(a,b,w,h)}function circle(a,b,r,col){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}
