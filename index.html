<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#141b29"><title>Stíny střech</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101521;color:white;font-family:system-ui;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#hud{position:fixed;top:env(safe-area-inset-top);left:12px;font-weight:700;text-shadow:0 2px 4px #000}#controls{position:fixed;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.cluster{display:flex;gap:12px;align-items:end}.btn{pointer-events:auto;touch-action:none;border:2px solid #ffffff77;border-radius:18px;background:#202b3ac9;color:white;width:66px;height:66px;font-size:24px;font-weight:800;user-select:none;-webkit-user-select:none}.btn:active{background:#567a9d}#message{position:fixed;top:22%;width:100%;text-align:center;font-size:20px;font-weight:800;text-shadow:0 2px 8px #000;pointer-events:none}#restart{display:none;position:fixed;top:34%;left:50%;transform:translateX(-50%);padding:12px 22px;background:#d7b77b;border:0;border-radius:12px;font-weight:bold;font-size:18px}</style></head><body><canvas id="game"></canvas><div id="hud"></div><div id="message"></div><button id="restart">Hrát znovu</button><div id="controls"><div class="cluster"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button></div><div class="cluster"><button class="btn" data-key="attack">⚔</button><button class="btn" data-key="jump">▲</button></div></div><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),hud=document.querySelector('#hud'),msg=document.querySelector('#message'),restart=document.querySelector('#restart');let W=0,H=0,scale=1,cam=0,last=0,gameOver=false,win=false,flash=0;const keys={left:false,right:false,jump:false,attack:false};function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*devicePixelRatio);canvas.height=Math.round(H*devicePixelRatio);ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();for(const b of document.querySelectorAll('[data-key]')){const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false})}const keymap={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack'};addEventListener('keydown',e=>{let k=keymap[e.code];if(k){e.preventDefault();keys[k]=true}});addEventListener('keyup',e=>{let k=keymap[e.code];if(k){e.preventDefault();keys[k]=false}});
const worldW=3200,groundY=500;const platforms=[{x:0,y:500,w:650},{x:730,y:470,w:470},{x:1270,y:505,w:430},{x:1770,y:460,w:550},{x:2390,y:490,w:810},{x:250,y:390,w:150},{x:840,y:365,w:200},{x:1380,y:390,w:170},{x:1910,y:345,w:210},{x:2590,y:380,w:200}];const coins0=[{x:310,y:350},{x:900,y:325},{x:1440,y:350},{x:1990,y:305},{x:2670,y:340}];let p,enemies,coins,attacking=false,attackLatch=false,jumpLatch=false,score=0;function reset(){p={x:60,y:400,w:27,h:48,vx:0,vy:0,face:1,hp:5,onGround:false,inv:0};enemies=[{x:490,y:450,hp:2,dir:1,min:440,max:590},{x:1010,y:420,hp:2,dir:-1,min:880,max:1110},{x:1510,y:455,hp:2,dir:1,min:1380,max:1640},{x:2100,y:410,hp:3,dir:-1,min:1900,max:2240},{x:2810,y:440,hp:3,dir:1,min:2610,max:3010}].map(e=>({...e,w:28,h:48,vy:0,inv:0,alive:true}));coins=coins0.map(c=>({...c,taken:false}));score=0;cam=0;gameOver=false;win=false;flash=0;restart.style.display='none';msg.textContent='';}restart.onclick=reset;reset();
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function physics(o,dt){let prevBottom=o.y+o.h;o.vy+=1700*dt;o.y+=o.vy*dt;o.onGround=false;for(const s of platforms){if(o.x+o.w>s.x+4&&o.x<s.x+s.w-4&&prevBottom<=s.y+9&&o.y+o.h>=s.y&&o.vy>=0){o.y=s.y-o.h;o.vy=0;o.onGround=true}}}function update(dt){if(gameOver)return;let move=(+keys.right)-(+keys.left);p.vx=move*240;if(move)p.face=move;p.x=Math.max(0,Math.min(worldW-p.w,p.x+p.vx*dt));if(keys.jump&&!jumpLatch&&p.onGround){p.vy=-650;p.onGround=false}jumpLatch=keys.jump;physics(p,dt);if(p.y>H+750){p.hp=0}p.inv=Math.max(0,p.inv-dt);attacking=keys.attack&&!attackLatch;attackLatch=keys.attack;if(attacking){let hit={x:p.face>0?p.x+p.w:p.x-52,y:p.y+8,w:52,h:35};for(const e of enemies)if(e.alive&&e.inv<=0&&overlap(hit,e)){e.hp--;e.inv=.35;if(e.hp<=0){e.alive=false;score+=100}}}for(const e of enemies){if(!e.alive)continue;e.inv=Math.max(0,e.inv-dt);e.x+=e.dir*58*dt;if(e.x<e.min||e.x>e.max)e.dir*=-1;physics(e,dt);if(overlap(p,e)&&p.inv<=0){p.hp--;p.inv=1.2;p.vy=-250;p.x=Math.max(0,p.x+e.dir*30);flash=.2}}for(const c of coins)if(!c.taken&&Math.abs(p.x+13-c.x)<28&&Math.abs(p.y+20-c.y)<40){c.taken=true;score+=50}if(p.x>3100){win=true;gameOver=true;msg.textContent='Mise splněna! Město je za tebou.';restart.style.display='block'}if(p.hp<=0){gameOver=true;msg.textContent='Mise selhala';restart.style.display='block'}flash=Math.max(0,flash-dt);cam=Math.max(0,Math.min(worldW-W,p.x-W*.32));hud.textContent='STÍNY STŘECH  •  '+ '♥'.repeat(Math.max(0,p.hp))+'♡'.repeat(5-Math.max(0,p.hp))+'  •  '+score+' bodů';}
function draw(){const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#182438');sky.addColorStop(1,'#ad7c68');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);const base=H*.72;ctx.fillStyle='#d9ae7b';ctx.beginPath();ctx.arc(W*.78,H*.18,35,0,Math.PI*2);ctx.fill();for(let layer=0;layer<3;layer++){ctx.fillStyle=['#334050','#293342','#202b37'][layer];for(let i=0;i<25;i++){let x=i*160-(cam*(.15+layer*.15)%160);let hh=90+((i*37+layer*53)%100);ctx.fillRect(x,base-hh+layer*30,120,hh+H);ctx.beginPath();ctx.moveTo(x-12,base-hh+layer*30);ctx.lineTo(x+60,base-hh-28+layer*30);ctx.lineTo(x+132,base-hh+layer*30);ctx.fill()}}ctx.save();ctx.translate(-cam,0);const offset=H*.76-500;ctx.translate(0,offset);for(const s of platforms){ctx.fillStyle='#695249';ctx.fillRect(s.x,s.y,s.w,900);ctx.fillStyle='#b89575';ctx.fillRect(s.x,s.y-13,s.w,15);ctx.fillStyle='#d3af85';for(let i=s.x+18;i<s.x+s.w-20;i+=65){ctx.fillRect(i,s.y+45,24,38);ctx.fillStyle='#2c2c39';ctx.fillRect(i+4,s.y+49,16,30);ctx.fillStyle='#d3af85'}}for(const c of coins)if(!c.taken){ctx.fillStyle='#f9d27c';ctx.beginPath();ctx.arc(c.x,c.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff1bb';ctx.stroke()}function character(o,enemy=false){if(o.inv>0&&Math.floor(o.inv*12)%2)return;ctx.save();ctx.translate(o.x+o.w/2,o.y);ctx.scale(enemy?o.dir:p.face,1);ctx.fillStyle=enemy?'#692f37':'#e9e2cc';ctx.beginPath();ctx.moveTo(-12,15);ctx.lineTo(0,0);ctx.lineTo(12,15);ctx.lineTo(8,27);ctx.lineTo(-8,27);ctx.fill();ctx.fillStyle=enemy?'#8e4047':'#303f50';ctx.fillRect(-11,24,22,20);ctx.fillStyle='#242633';ctx.fillRect(-10,43,8,5);ctx.fillRect(3,43,8,5);ctx.fillStyle='#d8c7a9';ctx.fillRect(2,15,8,4);if(!enemy&&keys.attack){ctx.strokeStyle='#f5f5e6';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(12,25);ctx.lineTo(55,14);ctx.stroke()}ctx.restore()}for(const e of enemies)if(e.alive)character(e,true);character(p);ctx.fillStyle='#e9d3a7';ctx.fillRect(3130,390,10,100);ctx.fillStyle='#d8b363';ctx.beginPath();ctx.moveTo(3140,392);ctx.lineTo(3190,410);ctx.lineTo(3140,430);ctx.fill();ctx.restore();if(flash){ctx.fillStyle='#ff333344';ctx.fillRect(0,0,W,H)}ctx.fillStyle='#ffffffa8';ctx.font='13px system-ui';ctx.fillText('Cíl: dostaň se k praporu →',12,Math.min(H-105,90));}function frame(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
