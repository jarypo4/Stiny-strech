<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#101a27"><title>Stíny střech 0.2</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#101a27;color:#fff;font-family:system-ui;touch-action:none}canvas{display:block;width:100vw;height:100dvh}#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 5px #000;font-size:12px;font-weight:700}#hud span{background:#101a27a8;padding:6px 9px;border-radius:8px}#story{position:fixed;left:50%;top:15%;transform:translateX(-50%);width:min(94vw,620px);background:#101925e8;border:1px solid #b79c6a;padding:16px 20px;border-radius:14px;z-index:5;box-shadow:0 8px 35px #0009}#story h2{margin:0 0 8px;color:#e8c58a}#story p{margin:0 0 12px;line-height:1.45}#story button,#reset{background:#d9b77b;border:0;border-radius:8px;padding:10px 18px;font-weight:800}#controls{position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 10px;pointer-events:none;gap:6px}.cluster{display:flex;gap:6px;pointer-events:auto}.btn{width:clamp(43px,11vw,66px);height:clamp(47px,12vw,62px);border:1px solid #fff7;border-radius:13px;background:#172a3ad9;color:white;font-size:20px;font-weight:800;touch-action:none;user-select:none}.btn:active,.btn.pressed{background:#607b93}#hint{position:fixed;bottom:90px;left:0;right:0;text-align:center;font-size:12px;text-shadow:0 2px 4px #000;pointer-events:none}#reset{position:fixed;top:7px;left:50%;transform:translateX(-50%);z-index:4;padding:5px 8px;font-size:11px;opacity:.8}@media(max-width:420px){.btn{width:43px;height:49px;font-size:17px}#controls{padding:0 5px}.cluster{gap:3px}#hint{bottom:74px}}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="info"></span><span id="weapon"></span></div><button id="reset">↺</button><div id="story"><h2 id="storyTitle"></h2><p id="storyText"></p><button id="continue">Pokračovat ▶</button></div><div id="hint"></div><div id="controls"><div class="cluster"><button class="btn" data-key="left">◀</button><button class="btn" data-key="right">▶</button></div><div class="cluster"><button class="btn" data-key="switch">⚙</button><button class="btn" data-key="rope">⛓</button><button class="btn" data-key="attack">⚔</button><button class="btn" data-key="jump">▲</button></div></div><script>
'use strict';const c=document.getElementById('game'),g=c.getContext('2d'),info=document.getElementById('info'),wlabel=document.getElementById('weapon'),hint=document.getElementById('hint'),story=document.getElementById('story');let W,H,D,cam=0,last=0,paused=true,level=0,score=0,frameN=0,attackFx=0,arrows=[],particles=[],shake=0;const key={left:0,right:0,jump:0,attack:0,rope:0,switch:0},tap={jump:0,attack:0,rope:0,switch:0};const scenes=[{name:'Posel soumraku',text:'Rok 1293. Město Varenna ovládá tajný Řád popela. Jsi Narek, posel, který získal důkaz o zradě městského správce. Probij se přes střechy k severní bráně.',theme:'city',width:3200,ground:[ [0,590,620],[700,550,480],[1260,590,490],[1820,540,580],[2470,580,730] ],ledge:[[270,465,170],[830,420,185],[1400,450,200],[2000,405,190],[2660,450,220]],enemy:[500,1000,1510,2110,2850],rope:[],horse:false,boss:false},{name:'Nad propastí',text:'Brána je uzavřená. Jediná cesta vede po starých akvaduktech. Použij hák s lanem u označených kruhů a přenes se přes široké mezery.',theme:'walls',width:3100,ground:[[0,590,520],[940,570,560],[1900,570,520],[2760,590,340]],ledge:[[250,455,155],[1040,440,200],[2000,435,200]],enemy:[350,1190,2100,2900],rope:[{x:720,y:315},{x:1690,y:310},{x:2590,y:320}],horse:false,boss:false},{name:'Královská stezka',text:'V lese čeká tvůj kůň Vichr. Hlídky Řádu popela pronásledují posly. Projeď stezkou, překonej překážky a doruč zprávu k pevnosti.',theme:'forest',width:4000,ground:[[0,590,4000]],ledge:[],enemy:[740,1300,1910,2580,3350],rope:[],horse:true,boss:false},{name:'Zrádce v pevnosti',text:'Správce Orven tě čeká na nádvoří. Jeho stráže chrání poslední bránu. Poraz Orvena a získej zpět pečeť města.',theme:'castle',width:3400,ground:[[0,590,650],[710,560,700],[1470,580,700],[2230,550,1170]],ledge:[[290,455,180],[900,430,180],[1670,440,210],[2460,410,230]],enemy:[490,1080,1730,2470],rope:[],horse:false,boss:true}];let s,p,enemies=[],ropes=[],checkpoint=0,weapon=0,won=false;const weapons=['Meč','Dýka','Luk'];function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;g.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();function press(k,v){if(v&&!key[k]&&k in tap)tap[k]=1;key[k]=v}document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);press(k,1);b.classList.add('pressed')});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{e.preventDefault();press(k,0);b.classList.remove('pressed')})});const binds={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',Space:'jump',ArrowUp:'jump',KeyW:'jump',KeyJ:'attack',KeyK:'attack',KeyE:'rope',KeyQ:'switch'};addEventListener('keydown',e=>{const k=binds[e.code];if(k){e.preventDefault();press(k,1)}});addEventListener('keyup',e=>{let k=binds[e.code];if(k){e.preventDefault();press(k,0)}});function show(t,body,btn='Pokračovat ▶'){document.getElementById('storyTitle').textContent=t;document.getElementById('storyText').textContent=body;document.getElementById('continue').textContent=btn;story.style.display='block';paused=true}document.getElementById('continue').onclick=()=>{if(won){won=false;score=0;load(0);return}story.style.display='none';paused=false};document.getElementById('reset').onclick=()=>{load(level)};function load(n){level=n;s=scenes[n];cam=0;attackFx=0;arrows=[];particles=[];checkpoint=0;weapon=0;p={x:60,y:450,w:30,h:57,vx:0,vy:0,hp:6,face:1,on:false,inv:0,cd:0,rope:null,horse:s.horse};enemies=s.enemy.map((x,i)=>({x,y:460,w:31,h:54,hp: i===s.enemy.length-1&&s.boss?12:3,max:i===s.enemy.length-1&&s.boss?12:3,dir:i%2?1:-1,origin:x,cd:0,inv:0,alive:true,boss:s.boss&&i===s.enemy.length-1}));ropes=s.rope.map(a=>({...a}));show('Kapitola '+(n+1)+' – '+s.name,s.text,'Hrát misi ▶')};function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function ground(o,dt){const old=o.y+o.h;o.vy+=1750*dt;o.y+=o.vy*dt;o.on=false;for(let a of [...s.ground,...s.ledge]){let [x,y,w]=a;if(o.x+o.w>x+6&&o.x<x+w-6&&old<=y+11&&o.y+o.h>=y&&o.vy>=0){o.y=y-o.h;o.vy=0;o.on=true}}}function spark(x,y,col,n=6){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*250,vy:-Math.random()*200,t:.4+Math.random()*.3,col})}function hurt(e,damage){if(e.inv>0||!e.alive)return;e.hp-=damage;e.inv=.25;spark(e.x+15,e.y+25,'#e2c08b');if(e.hp<=0){e.alive=false;score+=e.boss?600:100;spark(e.x+15,e.y+25,'#e7ba64',16)}}function update(dt){if(paused)return;frameN++;p.inv=Math.max(0,p.inv-dt);p.cd=Math.max(0,p.cd-dt);let move=key.right-key.left;if(move)p.face=move;let speed=p.horse?390:235;p.vx=move*speed;p.x=Math.max(0,Math.min(s.width-p.w,p.x+p.vx*dt));if(tap.jump){if(p.on){p.vy=p.horse?-720:-650;p.on=false}else if(p.rope){p.vy=-430;p.rope=null}}if(tap.switch)weapon=(weapon+1)%3;if(tap.rope&&s.rope.length){if(p.rope){p.rope=null}else{let near=ropes.filter(r=>Math.hypot(r.x-(p.x+15),r.y-(p.y+15))<390).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x))[0];if(near)p.rope={x:near.x,y:near.y}}}if(p.rope){let dx=p.rope.x-(p.x+15),dy=p.rope.y-(p.y+15),dist=Math.hypot(dx,dy);if(dist>280){p.x+=dx/dist*(dist-280)*.7;p.y+=dy/dist*(dist-280)*.7}p.vy=Math.min(p.vy,110);if(move)p.x+=move*180*dt;if(p.on)p.rope=null}ground(p,dt);if(p.y>850){p.hp=0}if(tap.attack&&p.cd<=0){p.cd=weapon===1?.22:weapon===2?.62:.38;attackFx=.2;if(weapon===2){arrows.push({x:p.x+15,y:p.y+25,vx:p.face*720,life:1.6})}else{let reach=weapon===1?40:75,box={x:p.face>0?p.x+p.w:p.x-reach,y:p.y+3,w:reach,h:53};enemies.forEach(e=>{if(e.alive&&rect(box,e))hurt(e,weapon===1?1:2)})}}attackFx=Math.max(0,attackFx-dt);for(const a of arrows){a.x+=a.vx*dt;a.life-=dt;for(const e of enemies)if(e.alive&&rect({x:a.x,y:a.y,w:16,h:5},e)){hurt(e,2);a.life=0}}arrows=arrows.filter(a=>a.life>0);for(const e of enemies){if(!e.alive)continue;e.inv=Math.max(0,e.inv-dt);e.cd=Math.max(0,e.cd-dt);if(Math.abs(p.x-e.x)<230)e.dir=Math.sign(p.x-e.x)||1;else if(Math.abs(e.x-e.origin)>115)e.dir=Math.sign(e.origin-e.x);e.x+=e.dir*(e.boss?95:54)*dt;ground(e,dt);if(Math.abs(p.x-e.x)<46&&Math.abs(p.y-e.y)<65&&e.cd<=0){e.cd=e.boss?.7:1.15;if(p.inv<=0){p.hp-=e.boss?2:1;p.inv=1.1;p.vy=-240;spark(p.x+15,p.y+30,'#e85f59');shake=.12}}}for(const q of particles){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=400*dt;q.t-=dt}particles=particles.filter(q=>q.t>0);shake=Math.max(0,shake-dt);if(p.hp<=0){show('Mise selhala','Narek padl. Zkus to znovu – můžeš měnit zbraně tlačítkem ⚙.','Zkusit znovu ↺');document.getElementById('continue').onclick=()=>{load(level);story.style.display='none';paused=false};return}let bossAlive=enemies.some(e=>e.boss&&e.alive);if(p.x>s.width-115&&!bossAlive){score+=300;if(level===scenes.length-1){won=true;show('Konec první kapitoly','Orven je poražen a město získalo zpět svou pečeť. Narek ale nachází mapu dalších pevností Řádu popela… Skóre: '+score,'Hrát od začátku ↺');document.getElementById('continue').onclick=()=>{won=false;score=0;load(0);story.style.display='none';paused=false}}else{load(level+1);document.getElementById('continue').onclick=()=>{story.style.display='none';paused=false}}return}cam=Math.max(0,Math.min(Math.max(0,s.width-W),p.x-W*.31));info.textContent='KAP. '+(level+1)+'/4 • ♥ '+p.hp+'/6 • ★ '+score;wlabel.textContent=weapons[weapon]+(p.horse?' • 🐎':'');hint.textContent=p.rope?'Lano připojeno • skokem se odpoj':s.rope.length?'⛓ Použij lano poblíž zlatých kruhů':s.horse?'🐎 Jízda na koni • přeskakuj překážky':'⚙ změna zbraně • ⚔ útok • ▲ skok';for(let k in tap)tap[k]=0}
function poly(points,color){g.fillStyle=color;g.beginPath();g.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)g.lineTo(points[i][0],points[i][1]);g.closePath();g.fill()}function building(x,y,w,h,i,layer){g.fillStyle=layer?'#344251':'#6b625d';g.fillRect(x,y,w,h);poly([[x-10,y],[x+w/2,y-32-(i%3)*8],[x+w+10,y]],layer?'#283849':'#564a49');if(!layer){g.fillStyle='#c1a88a';for(let xx=x+15;xx<x+w-18;xx+=43)for(let yy=y+26;yy<Math.min(y+h,680);yy+=80){g.fillRect(xx,yy,18,28);g.fillStyle='#24303b';g.fillRect(xx+3,yy+3,12,22);g.fillStyle='#c1a88a'}g.fillStyle='#40352e';g.fillRect(x+w*.42,y+h-80,35,80)}}function bg(){let colors=s.theme==='forest'?['#20394b','#a6b5a3']:s.theme==='castle'?['#1d2638','#ab7c68']:['#1b2a40','#bf8b71'];let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,colors[0]);sky.addColorStop(1,colors[1]);g.fillStyle=sky;g.fillRect(0,0,W,H);g.fillStyle='#e8bc7a';g.beginPath();g.arc(W*.78,H*.2,Math.min(42,W*.09),0,7);g.fill();for(let layer=0;layer<3;layer++){g.save();g.translate(-cam*(.1+layer*.18),0);for(let i=0;i<Math.ceil(s.width/170)+5;i++){let x=i*170;let y=H*.69-(i*37+layer*41)%85+layer*35;if(s.theme==='forest'){g.fillStyle=['#45635e','#314b49','#263f3e'][layer];g.fillRect(x+35,y-40,16,210);for(let k=0;k<3;k++){poly([[x-20,y+25-k*52],[x+43,y-105-k*52],[x+105,y+25-k*52]],g.fillStyle);}}else building(x,y,125,280,i,layer<2)}g.restore()}}function drawPlatform(a,i){let[x,y,w]=a;g.fillStyle=s.theme==='forest'?'#4c4438':'#615149';g.fillRect(x,y,w,800);g.fillStyle=s.theme==='forest'?'#62845b':'#c1a17b';g.fillRect(x,y-12,w,14);g.fillStyle='#372d30';for(let xx=x+20;xx<x+w-30;xx+=78){g.fillRect(xx,y+38,26,39);g.fillStyle='#b69a7e';g.fillRect(xx+4,y+4,3,70);g.fillStyle='#372d30'}if(s.theme!=='forest'){g.fillStyle='#d7b68a';for(let xx=x+12;xx<x+w;xx+=38)g.fillRect(xx,y-22,23,10)}}function character(o,enemy=false){if(o.inv>0&&Math.floor(o.inv*14)%2)return;g.save();g.translate(o.x+o.w/2,o.y);g.scale(enemy?o.dir:p.face,1);let walk=Math.sin(frameN*.22+(enemy?o.x:0))*((enemy||key.left||key.right)?6:1);if(!enemy&&p.horse){g.fillStyle='#5c392b';g.fillRect(-30,31,66,24);g.fillRect(21,20,23,24);g.fillStyle='#a37b56';g.fillRect(33,21,11,8);g.fillStyle='#3c2b2a';for(let xx of [-20,20]){g.fillRect(xx,53,7,17+walk/2)}g.fillStyle='#1e242a';g.fillRect(-8,25,25,6);g.translate(0,-12)}g.fillStyle='#222630';g.fillRect(-10,43,9,14+walk);g.fillRect(3,43,9,14-walk);poly([[-14,19],[11,19],[17,49],[-16,49]],enemy?'#863e41':'#263f4c');g.fillStyle=enemy?'#a75b50':'#aeb3ac';g.fillRect(-11,23,23,6);g.fillStyle='#8c6b4f';g.fillRect(-12,36,25,5);g.fillStyle='#e4c3a0';g.fillRect(-7,9,14,13);poly([[-15,14],[0,-8],[15,14],[8,22],[-9,22]],enemy?'#51383a':'#d9d3c5');g.fillStyle='#172532';g.fillRect(2,12,6,3);g.fillStyle='#9c7756';g.fillRect(8,23,9,7);if(enemy){g.fillStyle='#b3b9bd';g.fillRect(-13,17,26,5);if(o.boss){g.fillStyle='#d4b66f';g.fillRect(-16,20,32,7);g.fillStyle='#a53030';g.fillRect(-8,0,16,8)}}else{g.fillStyle='#ddd0ac';g.fillRect(-11,24,6,19);if(weapon===0){g.strokeStyle='#cbdce1';g.lineWidth=4;g.beginPath();g.moveTo(14,28);g.lineTo(attackFx?67:32,attackFx?8:14);g.stroke()}else if(weapon===1){g.strokeStyle='#e7e3d5';g.lineWidth=4;g.beginPath();g.moveTo(13,29);g.lineTo(attackFx?43:25,attackFx?16:20);g.stroke()}else{g.strokeStyle='#b38a4d';g.lineWidth=3;g.beginPath();g.arc(20,27,18,-1.4,1.4);g.stroke();g.strokeStyle='#e9e2ca';g.lineWidth=1;g.beginPath();g.moveTo(23,9);g.lineTo(23,45);g.stroke()}}g.restore();if(enemy&&o.boss){g.fillStyle='#161a20';g.fillRect(o.x-20,o.y-24,70,8);g.fillStyle='#c94740';g.fillRect(o.x-20,o.y-24,70*Math.max(0,o.hp/o.max),8)}}function draw(){g.save();if(shake)g.translate((Math.random()-.5)*6,(Math.random()-.5)*6);bg();const offset=H*.79-590;g.save();g.translate(-cam,offset);if(s.theme==='forest'){for(let x=80;x<s.width;x+=240){g.fillStyle='#293b33';g.fillRect(x,370,18,220);poly([[x-65,450],[x+10,280],[x+80,450]],'#315244');poly([[x-45,395],[x+10,240],[x+65,395]],'#3b614a')}}if(s.theme==='castle'){for(let x=0;x<s.width;x+=370){g.fillStyle='#444451';g.fillRect(x+90,180,100,400);g.fillStyle='#b8a087';for(let a=0;a<4;a++)g.fillRect(x+85+a*27,163,18,22);g.fillStyle='#202633';g.fillRect(x+125,250,27,64)}}s.ground.forEach(drawPlatform);s.ledge.forEach(drawPlatform);for(const r of ropes){g.strokeStyle='#e6c77f';g.lineWidth=5;g.beginPath();g.arc(r.x,r.y,14,0,Math.PI*2);g.stroke();g.strokeStyle='#7b6853';g.lineWidth=3;g.beginPath();g.moveTo(r.x,r.y-15);g.lineTo(r.x,r.y-75);g.stroke()}if(p.rope){g.strokeStyle='#e5d1a1';g.lineWidth=3;g.beginPath();g.moveTo(p.rope.x,p.rope.y);g.lineTo(p.x+15,p.y+20);g.stroke()}for(let a of arrows){g.strokeStyle='#e9d5a8';g.lineWidth=3;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(a.x-Math.sign(a.vx)*20,a.y);g.stroke()}for(let e of enemies)if(e.alive)character(e,true);character(p);for(let q of particles){g.globalAlpha=Math.min(1,q.t*2);g.fillStyle=q.col;g.fillRect(q.x,q.y,5,5)}g.globalAlpha=1;let end=s.width-75;g.fillStyle='#bca780';g.fillRect(end,445,12,145);poly([[end+12,448],[end+75,472],[end+12,495]],'#b64b3c');g.restore();g.restore();if(!paused&&s.boss&&enemies.some(e=>e.boss&&e.alive)){g.fillStyle='#f0d7a4';g.font='bold 12px system-ui';g.fillText('Poraz Orvena, než opustíš pevnost',12,H*.2)}}function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);draw();requestAnimationFrame(loop)}load(0);requestAnimationFrame(loop);
</script></body></html>
